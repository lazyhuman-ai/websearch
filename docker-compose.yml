services:
  searxng:
    image: searxng/searxng:latest
    container_name: websearch-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=websearch-mvp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - 'http://127.0.0.1:8080/search?q=healthcheck&format=json' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
